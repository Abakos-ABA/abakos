name: Feature request
description: Suggest an improvement or new capability
title: "[idea] "
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: What problem would this solve?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed solution
  - type: dropdown
    id: area
    attributes:
      label: Area
      options:
        - Desktop app / miner
        - DEX / bridge
        - Chain / EVM
        - Website
        - Docs
        - Other
